# SnouliBedrockBridge - Hub
#
# Der HTTP-Server liefert version.json, pack.mcpack und mappings.json an die
# Geyser-Extension auf dem Proxy. Der Port muss in G-Portal frei sein.
http:
  bind: 0.0.0.0
  port: 25887
  # Wird beim ersten Start automatisch durch einen Zufallswert ersetzt.
  # Denselben Wert in die config.yml der Geyser-Extension eintragen.
  token: "LANGER-ZUFALLSWERT"

# Nach jedem /iazip (sobald sich output/generated.zip aendert) automatisch neu bauen.
auto-build-on-iazip: true

# Name des Pakets in der Bedrock-Paketliste.
pack-name: "Snouli.net"

# Namespaces, die nicht umgewandelt werden, z. B. Test-Inhalte: [tutorial]
skip-namespaces: []

# Pfad zum fertigen Java-Paket von ItemsAdder (relativ zum Server-Ordner).
itemsadder-pack: plugins/ItemsAdder/output/generated.zip

# Font-Bilder, die groesser sind (Pixel), gelten als GUI-Bilder und werden uebersprungen.
max-glyph-size: 64

# 3D-Modelle und Moebel (Phase 2).
models-3d:
  enabled: true
  # Welcher "display"-Eintrag des Java-Modells gilt, wenn ein Item-Display das Moebel zeigt:
  # head, fixed, ground, ... oder none. Muss zur ItemsAdder-Einstellung des Moebels passen.
  display-context: head
  # Korrekturen fuer Moebel an Item-Displays, falls sie auf Bedrock verdreht oder verschoben
  # erscheinen. Drehung in Grad [x, y, z], Verschiebung in Bloecken [x, y, z].
  # Beispiel: Moebel stehen verkehrt herum -> display-rotation: [0, 180, 0]
  display-rotation: [0, 0, 0]
  display-translation: [0, 0, 0]
  # Eigene Verschiebung [x, y, z] in Bloecken fuer einzelne Moebel. Ersetzt display-translation
  # fuer dieses Moebel. Name = ItemsAdder-ID (snouli:park_bench) oder nur park_bench.
  per-item: {}
  #  park_bench: [0, 1.5, 0]

# Ruestungen (Phase 3): eigene Ruestungen bekommen auf Bedrock ein Ruestungsmodell am Koerper.
# Erkannt werden ItemsAdder-Ruestungen mit Equipment-Asset und gefaerbte Leder-Ruestungen mit
# eigener Textur. false = Ruestungen bleiben flache Items.
armor:
  enabled: true

# Item-Eigenschaften aus ItemsAdder an Bedrock weitergeben: Stapelgroesse, Haltbarkeit,
# Essen/Trinken, Verzauberungs-Schimmer, Verzauberbarkeit, Ruestungspunkte und Ruestungs-Slot.
# false = Bedrock uebernimmt alles vom Basis-Item.
item-components: true
